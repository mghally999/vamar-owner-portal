packages:
  - apps/*
  - packages/*

# Supply-chain policy: pnpm waits for a minimum release age before installing a new
# version; packages listed here are exempt because we pinned them deliberately.
minimumReleaseAgeExclude:
  - dotenv@18.0.6
  - '@cloudflare/workers-types@5.20261007.1'
  - miniflare@5.20261006.0-alpha
  - wrangler@4.148.0

# Lifecycle (build) scripts we allow; pnpm blocks them by default.
allowBuilds:
  esbuild: true
  protobufjs: true
  '@firebase/util': true
  workerd: true
  sharp: true
  '@tailwindcss/oxide': true
  '@parcel/watcher': true

# React Native + CMake on Windows need short, real paths: a flat node_modules like npm.
# (Expo recommends hoisted for monorepos; pnpm 12 reads this from pnpm-workspace.yaml.)
nodeLinker: hoisted
