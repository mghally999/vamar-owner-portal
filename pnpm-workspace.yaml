packages:
  - apps/*
  - packages/*

# Supply-chain policy: pnpm waits for a minimum release age before installing a new
# version; packages listed here are exempt because we pinned them deliberately.
minimumReleaseAgeExclude:
  - dotenv@18.0.6

# Lifecycle (build) scripts we allow; pnpm blocks them by default.
allowBuilds:
  esbuild: true
  protobufjs: true
  '@firebase/util': true
  workerd: true
  sharp: true
  '@tailwindcss/oxide': true
  '@parcel/watcher': true
  # jest's resolver: its script only downloads a native binary when the platform package is
  # missing, and the platform packages install as optional dependencies.
  unrs-resolver: false

# React Native + CMake on Windows need short, real paths: a flat node_modules like npm.
# (Expo recommends hoisted for monorepos; pnpm 12 reads this from pnpm-workspace.yaml.)
nodeLinker: hoisted

# Dependency advisories without an upstream fix in the parents we use (pnpm audit):
overrides:
  '@grpc/grpc-js@<1.13.6': '>=1.13.6'
  # GHSA for decode-uri-component (quadratic percent-decoding): fixed in 0.5.1.
  'decode-uri-component@<0.5.1': '>=0.5.1'
  # GHSA-gg6h-894w-4m9c (re2js lookbehind DoS, reached through firebase firestore): fixed in 2.8.7.
  're2js@<2.8.7': '>=2.8.7'
  # node-forge 1.4.3 fixes the PEM, PKCS#12, TLS, X.509, forge.http ReDoS and Ed25519 advisories
  # (Expo CLI, build time; it asks for ^1.3.3).
  'node-forge@<1.4.3': '>=1.4.3'
  # GHSA-3g3m-2fjr-6pw4 (glob keeps walking after an abort): 13.0.7 carries the fix (`return cb()`
  # in the walker's abort branches), inside the ^13.0.0 the Expo toolchain asks for.
  'glob@>=13.0.0 <13.0.7': '13.0.7'
  # GHSA-9wx9-5pv9-3349 and GHSA-f86p-h4j2-7qgj (seroval script injection): fixed in 1.6.11;
  # @tanstack/router-core asks for ^1.6.7.
  'seroval@<1.6.11': '>=1.6.11 <2'
  # GHSA-w5hq-g745-h8pq (uuid v3/v5/v6 buffer bounds): fixed in 11.1.1; the Expo toolchain's
  # uuid 7 and 8 only use the named v4 export, which 11.x keeps.
  'uuid@<11.1.1': '11.1.1'
  # GHSA-mrhx-c7xc-m3w5 (zod memory exhaustion): no zod 3 release is fixed, and the Expo CLI asks
  # for zod 3; it runs on zod 4 (checked with expo config and expo export).
  '@expo/cli>zod': '^4.6.6'
  # Not overridden, left visible in `pnpm audit` (dev only, not in --prod): GHSA-67mh-4wv8-2f99 in
  # esbuild 0.18 under drizzle-kit > @esbuild-kit/core-utils, which pins ~0.18.20. The advisory is
  # about esbuild's dev server; drizzle-kit only uses esbuild-kit to load its config file.

# Advisories accepted for now (AUDIT.md section 7, FUTURE.md), all moderate or below and reached
# only through build and test tooling. The CI gate (high and above) is unchanged; an advisory listed
# here is ignored by its id only, so a new advisory on the same package still shows.
auditConfig:
  ignoreGhsas:
    # node-forge: PKCS#1 v1.5 signature verification (expo cli). (The braces advisory was withdrawn;
    # the other node-forge ones are fixed by the override.)
    - GHSA-86w9-cpqp-85rv
    # glob: the advisory lists every version up to 14.0.1, but 13.0.7 (the override above) carries
    # the fix; glob 14 needs minimatch 11, outside what Expo asks for. glob 10.5.0 (jest coverage,
    # test-exclude ^10.4.1) has no 10.x fix; no glob call in the toolchain takes an AbortSignal.
    - GHSA-3g3m-2fjr-6pw4
    # minimatch: globparts amplification with optimizationLevel >= 2 and an attacker's pattern. Fixed
    # only in 11.0.1; Expo, ESLint, typescript-eslint and glob 13 all ask for ^10 (or ^9), so no
    # override is compatible. The patterns come from our own config files, at build time.
    - GHSA-g3hv-75wg-m249
