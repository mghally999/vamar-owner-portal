packages:
  - apps/*
  - packages/*

# Supply-chain policy: pnpm waits for a minimum release age before installing a new
# version; packages listed here are exempt because we pinned them deliberately.
minimumReleaseAgeExclude:
  - dotenv@18.0.6
  - '@cloudflare/workers-types@5.20261007.1'
  - miniflare@5.20261006.0-alpha
  - wrangler@4.148.0

# Lifecycle (build) scripts we allow; pnpm blocks them by default.
allowBuilds:
  esbuild: true
  protobufjs: true
  '@firebase/util': true
  workerd: true
  sharp: true
  '@tailwindcss/oxide': true
  '@parcel/watcher': true

# React Native + CMake on Windows need short, real paths: a flat node_modules like npm.
# (Expo recommends hoisted for monorepos; pnpm 12 reads this from pnpm-workspace.yaml.)
nodeLinker: hoisted

# Dependency advisories without an upstream fix in the parents we use (pnpm audit):
overrides:
  '@grpc/grpc-js@<1.13.6': '>=1.13.6'
  'decode-uri-component@<0.5.0': '>=0.5.0'

# Advisories accepted for now (AUDIT.md section 7, FUTURE.md): all three live only in the Expo
# build toolchain and have no fixed version that works with Expo SDK 57.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces: stack exhaustion through deeply nested patterns (react-native cli plugin)
    - GHSA-86w9-cpqp-85rv # node-forge: PKCS#1 v1.5 signature verification (expo cli)
    - GHSA-w5hq-g745-h8pq # uuid: buffer bounds in v3/v5/v6 (expo config plugins)
