packages:
  - apps/*
  - packages/*

# Supply-chain policy: pnpm waits for a minimum release age before installing a new
# version; packages listed here are exempt because we pinned them deliberately.
minimumReleaseAgeExclude:
  - dotenv@18.0.6
  - '@cloudflare/workers-types@5.20261007.1'
  - miniflare@5.20261006.0-alpha
  - wrangler@4.148.0

# Lifecycle (build) scripts we allow; pnpm blocks them by default.
allowBuilds:
  esbuild: true
  protobufjs: true
  '@firebase/util': true
  workerd: true
  sharp: true
  '@tailwindcss/oxide': true
  '@parcel/watcher': true
  # jest's resolver: its script only downloads a native binary when the platform package is
  # missing, and the platform packages install as optional dependencies.
  unrs-resolver: false

# React Native + CMake on Windows need short, real paths: a flat node_modules like npm.
# (Expo recommends hoisted for monorepos; pnpm 12 reads this from pnpm-workspace.yaml.)
nodeLinker: hoisted

# Dependency advisories without an upstream fix in the parents we use (pnpm audit):
overrides:
  '@grpc/grpc-js@<1.13.6': '>=1.13.6'
  'decode-uri-component@<0.5.0': '>=0.5.0'
  # GHSA-w5hq-g745-h8pq (uuid v3/v5/v6 buffer bounds): fixed in 11.1.1; the Expo toolchain's
  # uuid 7 and 8 only use the named v4 export, which 11.x keeps.
  'uuid@<11.1.1': '11.1.1'
  # GHSA-mrhx-c7xc-m3w5 (zod memory exhaustion): no zod 3 release is fixed, and the Expo CLI asks
  # for zod 3; it runs on zod 4 (checked with expo config and expo export).
  '@expo/cli>zod': '^4.6.6'

# Advisory accepted for now (AUDIT.md section 7, FUTURE.md): no fixed node-forge release exists;
# it is reached only through the Expo CLI at build time. (The braces advisory was withdrawn.)
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge: PKCS#1 v1.5 signature verification (expo cli)
