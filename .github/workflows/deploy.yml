name: Deploy

# main -> staging (migrate the staging Neon branch, deploy the staging Worker, smoke test).
# tag v* -> the same for staging, then production only if staging passed.
# Without CLOUDFLARE_API_TOKEN both jobs FAIL (red), so a missing deploy is never reported as green.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, STAGING_DATABASE_URL_OWNER,
# PROD_DATABASE_URL_OWNER (owner roles, used for migrations only; the Workers use their own
# vamar_app URLs stored as Worker secrets).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Staging
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Deploy credentials present?
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN is not set (BLOCKED.md item 6); staging was NOT deployed. Deploy by hand (HANDOVER.md) until the token exists."
          exit 1
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate the staging database
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_OWNER }}
        run: pnpm db:migrate
      - name: Dashboard Firebase web config (public; repository variables)
        run: |
          cat > apps/dashboard/.env.production <<EOF
          VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          EOF
      - name: Build the dashboard and the owner web app
        run: pnpm build:web
      - name: Deploy the staging Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging --var RELEASE:${SHA::7}
      - name: Smoke test
        run: node tooling/ci/smoke.mjs https://vamar-owner-portal-staging.vamar-api.workers.dev staging
      - name: Owner web app on an iPhone screen (Playwright)
        working-directory: apps/dashboard
        env:
          PW_CHANNEL: chromium
          PWA_URL: https://vamar-owner-portal-staging.vamar-api.workers.dev
        run: |
          npx playwright install --with-deps chromium
          pnpm e2e:pwa

  production:
    name: Production
    needs: staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Deploy credentials present?
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN is not set (BLOCKED.md item 6); production was not deployed."
          exit 1
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate the production database
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_OWNER }}
        run: pnpm db:migrate
      - name: Dashboard Firebase web config (public; repository variables)
        run: |
          cat > apps/dashboard/.env.production <<EOF
          VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          EOF
      - name: Build the dashboard and the owner web app
        run: pnpm build:web
      - name: Deploy the production Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var RELEASE:${GITHUB_REF_NAME}
      - name: Smoke test
        run: node tooling/ci/smoke.mjs https://vamar-owner-portal.vamar-api.workers.dev production
