name: Nightly database backup

# pg_dump of the Neon database, gzipped and encrypted with age (only the offline private key can
# read it), kept as a private workflow artifact for 35 days. When the R2 keys are set it is also
# copied to a private R2 bucket, where backups older than 30 days are deleted. Secrets:
#   PROD_DATABASE_URL_OWNER  Neon owner connection string: a complete dump needs every schema,
#                            including the migrations journal the application role cannot read
#   BACKUP_DATABASE_URL   used only when the owner string is not set
#   BACKUP_AGE_RECIPIENT  age public key (age1...); the private key stays offline
#   optional, for the R2 copy:
#   R2_ACCOUNT_ID         Cloudflare account id (endpoint https://<id>.r2.cloudflarestorage.com)
#   R2_BACKUP_BUCKET      private bucket name, e.g. vamar-backups
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY   R2 API token scoped to that bucket
# Restore: download the artifact, then
#   age --decrypt -i <private key file> vamar-<stamp>.sql.gz.age | gunzip | psql "<target url>"

on:
  schedule:
    - cron: '30 0 * * *' # 00:30 UTC = 04:30 Dubai, after the 04:00 UTC alerts cron has run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
    steps:
      # pg_dump from the official image, same major version as the server (17): the PostgreSQL
      # apt repository is not always available for the newest runner image, which broke this job.
      - name: Install age and fetch the PostgreSQL 17 client image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          docker pull -q postgres:17

      - name: Dump, compress, encrypt
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_OWNER || secrets.BACKUP_DATABASE_URL }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%dT%H%M%SZ)"
          FILE="vamar-${STAMP}.sql.gz.age"
          docker run --rm -e DATABASE_URL postgres:17 \
            pg_dump --no-owner --no-privileges --format=plain "$DATABASE_URL" \
            | gzip -9 \
            | age --recipient "$AGE_RECIPIENT" --output "$FILE"
          # An empty or tiny file means the dump failed even if the pipe did not say so.
          SIZE="$(stat -c %s "$FILE")"
          echo "backup $FILE: $SIZE bytes"
          [ "$SIZE" -gt 10000 ] || { echo "backup is suspiciously small"; exit 1; }
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Keep as a private artifact (35 days)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 35
          if-no-files-found: error
          compression-level: 0

      - name: Copy to R2 (when the R2 keys are set)
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        run: |
          set -euo pipefail
          aws s3 cp "$FILE" "s3://$BUCKET/postgres/$FILE" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "uploaded postgres/$FILE"
          CUTOFF="$(date -u -d '30 days ago' +%Y-%m-%d)"
          aws s3 ls "s3://$BUCKET/postgres/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $1, $4}' \
            | while read -r day key; do
                if [ -n "$key" ] && [ "$day" \< "$CUTOFF" ]; then
                  aws s3 rm "s3://$BUCKET/postgres/$key" --endpoint-url "$R2_ENDPOINT" --only-show-errors
                  echo "deleted $key ($day)"
                fi
              done

      - name: Remove local dump
        if: always()
        run: rm -f ./*.age
